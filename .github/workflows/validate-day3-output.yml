name: Validate Day 3 Anomaly Output

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Day 3 output
        run: python scripts/validate_day3_output.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate Day 4 triage report from Day 3 output
        run: python scripts/triage_from_day3.py
      - name: Upload Day 4 triage preview
        uses: actions/upload-artifact@v4
        with:
          name: day4-triage-preview
          path: |
            outputs/incident_events.json
            outputs/day4_incident_report.md
